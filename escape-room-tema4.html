<style>

/* === RESPONSIVE + SAFARI === */
button{-webkit-tap-highlight-color:transparent}

<body>
<canvas id="three-canvas"></canvas>
<button id="toggle3d" onclick="toggle3D()">3D: ON</button>
<div id="wrapper">
  <div id="app">Cargando...</div>
  <div id="schemaPanel">
    <h2>&#128190; ARCHIVO DE REFERENCIA</h2>
    <pre id="schemaContent"></pre>
    <button class="close-btn" onclick="toggleReference()">CERRAR REFERENCIA</button>
  </div>
</div>
<div id="profPanel"></div>
<script>
// ============================================================
// CODIGO FIJO - Quiz Escape Room
// Copiar tal cual en cada escape room quiz generado
// Solo cambiar lo marcado con {ADAPTAR}
// ============================================================

// === STATE ===
var state = {
  screen: 'title', name: '', hash: 0, lives: 3, step: 0, maxStep: 0,
  branch1: null, branch2: null, solved: false, schemaOpen: false,
  solvedQueries: {}, proof: [], startTime: 0, profMode: false,
  selectedAnswer: null, seed: 0, bankMode: false
};

// === QUESTION BANK SYSTEM ===
// El banco se declara en la seccion ADAPTAR como: var QUESTION_BANK = [...]
// Cada pregunta tiene: { topic: 'nombre_tema', tier: 1|2|3, ... }
// topic: nombre del tema (ej: 'Epidemiologia basica', 'Pruebas diagnosticas')
// tier: 1 (facil), 2 (medio), 3 (dificil)
// selectQuestions() selecciona 19 preguntas por dificultad progresiva, mezclando temas

var shared1 = [], shared2 = [], branch1A = [], branch1B = [];
var shared3 = [], branch2C = [], branch2D = [], shared4 = [];

function _seedRandom(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function _makeSeed(name) {
  var d = new Date();
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  var str = name.trim().toLowerCase() + '|' + dateStr;
  var h = 0;
  for (var i = 0; i < str.length; i++) {
    h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

function _shuffleWithSeed(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function _pickByTier(bank, tier, n, rng) {
  // Selecciona n preguntas del tier indicado, barajadas, mezclando temas
  var pool = _shuffleWithSeed(bank.filter(function(q) { return q.tier === tier; }), rng);
  return pool.slice(0, n);
}

function _removeUsed(bank, used) {
  return bank.filter(function(q) {
    return used.indexOf(q) === -1;
  });
}

function selectQuestions(name) {
  var seed = _makeSeed(name);
  state.seed = seed;
  var rng = _seedRandom(seed);

  // Copia del banco para ir eliminando las ya usadas
  var available = QUESTION_BANK.slice();

  // Steps 0-2: 3 preguntas faciles (tier 1)
  shared1 = _pickByTier(available, 1, 3, rng);
  available = _removeUsed(available, shared1);

  // Steps 3-5: 3 preguntas medias (tier 2)
  shared2 = _pickByTier(available, 2, 3, rng);
  available = _removeUsed(available, shared2);

  // Steps 7-8 rama A: 2 preguntas medias (tier 2)
  branch1A = _pickByTier(available, 2, 2, rng);
  available = _removeUsed(available, branch1A);

  // Steps 7-8 rama B: 2 preguntas medias (tier 2)
  branch1B = _pickByTier(available, 2, 2, rng);
  available = _removeUsed(available, branch1B);

  // Steps 9-10: 2 preguntas dificiles (tier 3)
  shared3 = _pickByTier(available, 3, 2, rng);
  available = _removeUsed(available, shared3);

  // Steps 12-13 rama C: 2 preguntas dificiles (tier 3)
  branch2C = _pickByTier(available, 3, 2, rng);
  available = _removeUsed(available, branch2C);

  // Steps 12-13 rama D: 2 preguntas dificiles (tier 3)
  branch2D = _pickByTier(available, 3, 2, rng);
  available = _removeUsed(available, branch2D);

  // Steps 14-16: 3 preguntas dificiles (tier 3)
  shared4 = _pickByTier(available, 3, 3, rng);
  _assignRooms();
}

// === ANTI-CHEAT ===
// {ADAPTAR: cambiar los char codes del SALT para cada tema}
const _SALT = [78,69,88,85,83,95,84,52,95,65,80,50,54].map(c=>String.fromCharCode(c)).join('');
const _REQUIRED_PROOFS = 15;

function _fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0);
}
function _proofHash(answer, step, prevHash) {
  var input = _SALT + '|' + step + '|' + answer.trim().toLowerCase() + '|' + prevHash;
  return _fnv1a(input).toString(36);
}
function _chainHash(proofArr) {
  return _fnv1a(proofArr.join('+')+_SALT).toString(36);
}
function addProof(answer, step) {
  var prev = state.proof.length > 0 ? state.proof[state.proof.length - 1] : '0';
  var p = _proofHash(answer, step, prev);
  if (!state.proof.some(function(x) { return x.startsWith(step + ':'); })) {
    state.proof.push(step + ':' + p);
  }
}
function validateProofChain() {
  if (state.proof.length < _REQUIRED_PROOFS) return false;
  var provenSteps = {};
  state.proof.forEach(function(p) { provenSteps[parseInt(p.split(':')[0])] = true; });
  var requiredSteps = [0,1,2,3,4,5,7,8,9,10,12,13,14,15,16];
  return requiredSteps.every(function(s) { return provenSteps[s]; });
}
function getProofSignature() {
  var chain = _chainHash(state.proof);
  var nameH = _fnv1a(state.name + _SALT).toString(36);
  var timeMin = Math.floor((Date.now() - state.startTime) / 60000);
  return { chain: chain, nameH: nameH, timeMin: timeMin };
}

// === HELPERS ===
function hashName(name) {
  var h = 0;
  var n = name.trim().toLowerCase();
  for (var i = 0; i < n.length; i++) {
    h = ((h << 5) - h + n.charCodeAt(i)) | 0;
  }
  return Math.abs(h) % 4;
}
function livesHTML() {
  var h = '';
  for (var i = 0; i < 3; i++) {
    h += '<span class="heart' + (i >= state.lives ? ' dead' : '') + '">&#9829;</span> ';
  }
  return h;
}

// === ANSWER VALIDATION ===
function validateAnswer(ch, answer) {
  if (ch.type === 'mc') return answer === ch.correctAnswer;
  if (ch.type === 'tf') return answer === ch.correctAnswer;
  // short y fill: normalizacion + comparacion case-insensitive + sin acentos
  var norm = answer.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return ch.acceptedAnswers.some(function(a) {
    var na = a.trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return norm === na;
  });
}

// === GAME FLOW ===
function getCurrentStep() {
  var s = state.step;
  if (s <= 2) return { type:'challenge', data: shared1[s] };
  if (s <= 5) return { type:'challenge', data: shared2[s - 3] };
  if (s === 6) return { type:'branch', id: 1 };
  if (s <= 8) return { type:'challenge', data: (state.branch1 === 'A' ? branch1A : branch1B)[s - 7] };
  if (s <= 10) return { type:'challenge', data: shared3[s - 9] };
  if (s === 11) return { type:'branch', id: 2 };
  if (s <= 13) return { type:'challenge', data: (state.branch2 === 'C' ? branch2C : branch2D)[s - 12] };
  if (s <= 16) return { type:'challenge', data: shared4[s - 14] };
  return { type:'victory' };
}
function getChallengeNumber() {
  var s = state.step;
  if (s <= 5) return s + 1;
  if (s <= 8) return s;
  if (s <= 10) return s;
  return s - 1;
}
function getFinalPhraseIndex() {
  var branchCombo = (state.branch1 === 'A' ? 0 : 1) * 2 + (state.branch2 === 'C' ? 0 : 1);
  return state.hash * 4 + branchCombo;
}
function getCompletionCode() {
  // {ADAPTAR: cambiar 'QER' por el prefijo del tema}
  if (!validateProofChain()) return 'INVALID-PROOF';
  var sig = getProofSignature();
  var prefix = state.name.replace(/\s+/g, '').substring(0, 3).toUpperCase();
  var branches = state.branch1 + state.branch2;
  var sigHash = _fnv1a(state.name + sig.chain + branches + _SALT + sig.timeMin);
  var sigCode = (sigHash >>> 0).toString(36).toUpperCase().padStart(7, '0');
  return 'AIA-' + prefix + '-' + branches + '-' + sig.chain.toUpperCase() + '-' + sigCode + '-' + sig.timeMin + 'm';
}
function isStepSolved(s) { return state.solvedQueries[s] !== undefined; }
function canGoBack() {
  if (state.step <= 0) return false;
  var prev = state.step - 1;
  while (prev >= 0) {
    var s = getStepType(prev);
    if (s === 'challenge') return true;
    prev--;
  }
  return false;
}
function getStepType(s) {
  if (s === 6 || s === 11) return 'branch';
  if (s >= 17) return 'victory';
  return 'challenge';
}
function findPrevChallenge() {
  var s = state.step - 1;
  while (s >= 0) {
    if (getStepType(s) === 'challenge') return s;
    s--;
  }
  return -1;
}
function findNextChallenge() {
  var s = state.step + 1;
  while (s <= 17) {
    if (getStepType(s) !== 'branch') return s;
    s++;
  }
  return state.step + 1;
}

// === RENDER ===
function render() {
  updateThreeScene();
  var app = document.getElementById('app');
  if (state.screen === 'title') { renderTitle(app); renderProfPanel(); return; }
  if (state.screen === 'intro') { renderIntro(app); renderProfPanel(); return; }
  if (state.screen === 'gameover') { renderGameOver(app); renderProfPanel(); return; }
  var step = getCurrentStep();
  if (step.type === 'challenge') renderChallenge(app, step.data);
  else if (step.type === 'branch') renderBranch(app, step.id);
  else if (step.type === 'victory') renderVictory(app);
  renderProfPanel();
}

// renderChallenge - QUIZ VERSION (FIJO, no adaptar)
function renderChallenge(app, ch) {
  var num = getChallengeNumber();
  var viewing = !state.profMode && state.step < state.maxStep && isStepSolved(state.step);
  var previousAnswer = state.solvedQueries[state.step] || '';
  var prevStep = findPrevChallenge();
  var canBack = prevStep >= 0;
  var canForward = state.step < state.maxStep;

  var answerHTML = '';
  if (ch.type === 'mc') {
    answerHTML = '<div class="quiz-options" id="quizOptions">';

      var letter = letters[i];

      }

        (viewing ? '' : ' onclick="selectOption(\'' + letter + '\')"') + '>' +

    }

    answerHTML = '<div class="tf-options" id="quizOptions">';
    var tfOpts = [{letter:'V', label:'VERDADERO', icon:'&#10003;'}, {letter:'F', label:'FALSO', icon:'&#10007;'}];
    for (var t = 0; t < tfOpts.length; t++) {
      var opt = tfOpts[t];
      var selCls = '';
      if (viewing && previousAnswer === opt.letter) selCls = ' selected correct';
      else if (state.profMode && opt.letter === ch.correctAnswer) selCls = ' selected correct';
      answerHTML += '<div class="tf-card' + selCls + '" data-letter="' + opt.letter + '"' +
        (viewing ? '' : ' onclick="selectOption(\'' + opt.letter + '\')"') + '>' +
        '<div class="tf-icon">' + opt.icon + '</div>' +
        '<div class="tf-label">' + opt.label + '</div></div>';
    }
    answerHTML += '</div>';
  } else if (ch.type === 'short') {
    var prefill = viewing ? previousAnswer : (state.profMode ? ch.correctAnswer : '');
    answerHTML = '<div class="answer-area">' +
      '<input type="text" class="answer-input" id="answerInput" placeholder="Escribe tu respuesta..." ' +
      'value="' + prefill.replace(/"/g, '&quot;') + '" ' +
      'autocomplete="off" spellcheck="false" ' +
      (viewing ? 'readonly' : '') + '></div>';
  } else if (ch.type === 'fill') {
    var prefillF = viewing ? previousAnswer : (state.profMode ? ch.correctAnswer : '');
    answerHTML = '<div class="answer-area">' +
      '<p class="fill-question">' + ch.question + '</p>' +
      '<input type="text" class="answer-input" id="answerInput" placeholder="Completa el hueco..." ' +
      'value="' + prefillF.replace(/"/g, '&quot;') + '" ' +
      'autocomplete="off" spellcheck="false" ' +
      (viewing ? 'readonly' : '') + '></div>';
  }

  app.innerHTML =
    '<div class="screen">' +
      '<div class="top-bar">' +
        '<div class="hearts" id="livesDisplay">' + livesHTML() + '</div>' +
        '<div class="progress">PRUEBA ' + num + ' / 15</div>' +
        '<button class="schema-btn' + (state.schemaOpen ? ' active' : '') + '" onclick="toggleReference()">&#128218; REFERENCIA</button>' +
      '</div>' +
      '<div class="room-name">' + ch.room + (viewing ? '<span class="solved-badge">&#10004; RESUELTA</span>' : '') + '</div>' +
      '<p class="narrative">' + ch.narrative + '</p>' +
      '<div class="task-box">' +
        '<h3>&#128203; ' + ch.title + '</h3>' +
        questionText +
      '</div>' +
      '<p class="hint">&#128161; ' + ch.hint + '</p>' +
      answerHTML +
      ((!viewing && !state.solved) ?
        '<button class="confirm-btn" id="confirmBtn" onclick="submitAnswer()">&#9876; CONFIRMAR RESPUESTA</button>' : '') +
      '<div id="feedback">' + (viewing ? '<div class="feedback ok">&#10004; Ya resolviste esta prueba.</div>' : '') + '</div>' +
      '<div class="nav-row">' +

        ((state.solved || viewing) && canForward ? '<button class="next-btn" onclick="goForward()">SIGUIENTE &#8594;</button>' : '') +
        (state.solved && !canForward ? '<button class="next-btn" id="nextBtn" onclick="nextStep()">AVANZAR &#8594;</button>' : '') +

  // Keyboard handler para inputs

    var input = document.getElementById('answerInput');
    if (input) {

      });

// === SELECT OPTION (mc/tf) ===
function selectOption(letter) {
  if (state.solved) return;
  state.selectedAnswer = letter;
  var cards = document.querySelectorAll('.option-card, .tf-card');
  for (var i = 0; i < cards.length; i++) {
    cards[i].classList.remove('selected');
    if (cards[i].getAttribute('data-letter') === letter) {
      cards[i].classList.add('selected');
    }
  }
}

// === SUBMIT ANSWER ===
function submitAnswer() {
  if (state.solved) return;
  var step = getCurrentStep();
  var ch = step.data;
  var answer;

  if (ch.type === 'mc' || ch.type === 'tf') {
    answer = state.selectedAnswer;
    if (!answer) return; // nada seleccionado
  } else {
    var input = document.getElementById('answerInput');
    answer = input ? input.value.trim() : '';
    if (!answer) return;
  }

  var feedback = document.getElementById('feedback');
  var correct = validateAnswer(ch, answer);

  if (correct) {
    state.solved = true;
    var answerStr = (ch.type === 'mc' || ch.type === 'tf') ? answer : answer;
    state.solvedQueries[state.step] = answerStr;
    addProof(answerStr, state.step);
    if (state.step >= state.maxStep) state.maxStep = state.step + 1;

    // Mostrar feedback correcto
    var fbText = ch.feedback && ch.feedback.correct ? ch.feedback.correct : '';
    feedback.innerHTML = '<div class="feedback ok">&#10004; &#161;Correcto! ' + fbText + '</div>';

    // Deshabilitar boton confirmar
    var btn = document.getElementById('confirmBtn');
    if (btn) btn.disabled = true;

    // Marcar opcion correcta visualmente
    if (ch.type === 'mc' || ch.type === 'tf') {
      var cards = document.querySelectorAll('.option-card, .tf-card');
      for (var i = 0; i < cards.length; i++) {
        var l = cards[i].getAttribute('data-letter');
        if (l === ch.correctAnswer) cards[i].classList.add('correct');
        else if (l === answer && l !== ch.correctAnswer) cards[i].classList.add('incorrect');
        // Deshabilitar clicks
        cards[i].onclick = null;
        cards[i].style.cursor = 'default';
      }
    } else {
      var inp = document.getElementById('answerInput');
      if (inp) inp.readOnly = true;
    }

    // Mostrar boton avanzar
    var navRow = document.querySelector('.nav-row');
    if (navRow) {
      var prevStep = findPrevChallenge();
      navRow.innerHTML =
        (prevStep >= 0 ? '<button class="prev-btn" onclick="goToStep(' + prevStep + ')">&#8592; ANTERIOR</button>' : '') +
        '<button class="next-btn" onclick="nextStep()">AVANZAR &#8594;</button>';
    }
  } else {
    // Respuesta incorrecta
    var fbWrong = ch.feedback && ch.feedback.incorrect ? ch.feedback.incorrect : '';
    if (state.profMode) {
      feedback.innerHTML = '<div class="feedback fail">&#10006; Incorrecto. ' + fbWrong +
        ' <span style="opacity:.6;font-size:.9em">(modo profesor: sin penalizaci\u00f3n)</span></div>';
    } else {
      state.lives--;
      feedback.innerHTML = '<div class="feedback fail">&#10006; Incorrecto. ' + fbWrong +
        ' (Vidas restantes: ' + state.lives + ')</div>';
      updateLivesDisplay();
      if (state.lives <= 0) {
        var btn2 = document.getElementById('confirmBtn');
        if (btn2) btn2.disabled = true;
        setTimeout(function() { state.screen = 'gameover'; render(); }, 2000);
      }
    }

    // Para mc/tf: marcar la incorrecta en rojo (pero no revelar la correcta)
    if (ch.type === 'mc' || ch.type === 'tf') {
      var cards2 = document.querySelectorAll('.option-card, .tf-card');
      for (var j = 0; j < cards2.length; j++) {
        if (cards2[j].getAttribute('data-letter') === answer) {
          cards2[j].classList.add('incorrect');
        }
        cards2[j].classList.remove('selected');
      }
      state.selectedAnswer = null;
    }
  }
}

function updateLivesDisplay() {
  var el = document.getElementById('livesDisplay');
  if (el) el.innerHTML = livesHTML();
}

// === TOGGLE REFERENCE ===
function toggleReference() {
  state.schemaOpen = !state.schemaOpen;
  var panel = document.getElementById('schemaPanel');
  var content = document.getElementById('schemaContent');
  if (state.schemaOpen) {
    content.textContent = REFERENCE_TEXT;
    panel.classList.add('visible');
  } else {
    panel.classList.remove('visible');
  }
  var btns = document.querySelectorAll('.schema-btn');
  for (var i = 0; i < btns.length; i++) {
    if (state.schemaOpen) btns[i].classList.add('active');
    else btns[i].classList.remove('active');
  }
}

// === GAME ACTIONS ===
function transitionTo(fn) {
  var app = document.getElementById('app');
  var screen = app.querySelector('.screen');
  if (screen) {
    screen.classList.add('screen-exit');
    setTimeout(function() { fn(); window.scrollTo(0, 0); }, 280);
  } else { fn(); window.scrollTo(0, 0); }
}
function startGame() {
  var input = document.getElementById('nameInput');
  var name = input ? input.value.trim() : '';
  if (name.length < 2) {
    input.style.borderColor = 'var(--error)';
    input.placeholder = 'Escribe al menos 2 caracteres...';
    return;
  }
  state.name = name;
  state.hash = hashName(name);
  transitionTo(function() { state.screen = 'intro'; render(); });
}
function startAdventure() {
  transitionTo(function() {
    state.screen = 'game'; state.step = 0; state.maxStep = 0;
    state.lives = 3; state.branch1 = null; state.branch2 = null;
    state.solved = false; state.solvedQueries = {}; state.proof = [];
    state.startTime = Date.now(); state.selectedAnswer = null;
    selectQuestions(state.name);
    render();
  });
}
function chooseBranch(branchId, choice) {
  transitionTo(function() {
    if (branchId === 1) state.branch1 = choice;
    else state.branch2 = choice;
    state.step++;
    if (state.step > state.maxStep) state.maxStep = state.step;
    render();
  });
}
function nextStep() {
  transitionTo(function() {
    state.step++;
    if (state.step > state.maxStep) state.maxStep = state.step;
    state.solved = false;
    state.selectedAnswer = null;
    render();
  });
}
function goToStep(s) {
  transitionTo(function() {
    state.step = s;
    state.solved = isStepSolved(s);
    state.selectedAnswer = null;
    render();
  });
}
function goForward() {
  var next = state.step + 1;
  while (next <= state.maxStep && getStepType(next) === 'branch') next++;
  if (next <= state.maxStep) goToStep(next);
}
function restartGame() {
  state = {
    screen: 'title', name: '', hash: 0, lives: 3, step: 0, maxStep: 0,
    branch1: null, branch2: null, solved: false, schemaOpen: false,
    solvedQueries: {}, proof: [], startTime: 0, profMode: false,
    selectedAnswer: null, seed: 0, bankMode: false
  };
  document.getElementById('schemaPanel').classList.remove('visible');
  document.body.style.paddingBottom = '';
  render();
}

// === INIT ===
document.addEventListener('DOMContentLoaded', function() {

// === THREE.JS ENGINE ===
var tjs = null;
function initThreeJS() {
  if (typeof THREE === 'undefined') return;
  var canvas = document.getElementById('three-canvas');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  var scene = new THREE.Scene();
  // {ADAPTAR: cambiar color fog al --bg del tema}
  scene.fog = new THREE.FogExp2(0x0a0f0a, 0.035);
  var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 2, 8); camera.lookAt(0, 1, 0);
  tjs = { renderer: renderer, scene: scene, camera: camera, canvas: canvas, clock: new THREE.Clock(), currentScene: null, sceneObjects: [], particles: null, animCallbacks: [], frameCount: 0 };
  window.addEventListener('resize', function() {
    if (!tjs) return;
    tjs.camera.aspect = window.innerWidth / window.innerHeight;
    tjs.camera.updateProjectionMatrix();
    tjs.renderer.setSize(window.innerWidth, window.innerHeight);
  });
  buildTitleScene();
  animateThreeJS();
}
function clearScene() {
  if (!tjs) return;
  tjs.sceneObjects.forEach(function(obj) {
    tjs.scene.remove(obj);
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(function(m) { m.dispose(); });
      else obj.material.dispose();
    }
    if (obj.children) obj.children.forEach(function(child) { if (child.geometry) child.geometry.dispose(); if (child.material) child.material.dispose(); });
  });
  tjs.sceneObjects = []; tjs.animCallbacks = [];
}

// === THREE.JS HELPERS ===
function addDust(count, color, spread, height, opacity) {
  var geo = new THREE.BufferGeometry();
  var pos = new Float32Array(count * 3);
  for (var i = 0; i < count; i++) { pos[i*3]=(Math.random()-0.5)*spread; pos[i*3+1]=Math.random()*height; pos[i*3+2]=(Math.random()-0.5)*spread; }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var mat = new THREE.PointsMaterial({ color: color, size: 0.04, transparent: true, opacity: opacity||0.4, sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false });
  var pts = new THREE.Points(geo, mat);
  tjs.scene.add(pts); tjs.sceneObjects.push(pts); return pts;
}
function addGround(color) {
  var g = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: color, roughness: 0.95, metalness: 0.05 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true;
  tjs.scene.add(g); tjs.sceneObjects.push(g); return g;
}
function addObj(geo, mat, pos, rot) {
  var m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (rot) { m.rotation.x = rot[0]||0; m.rotation.y = rot[1]||0; m.rotation.z = rot[2]||0; }
  m.castShadow = true; m.receiveShadow = true;
  tjs.scene.add(m); tjs.sceneObjects.push(m); return m;
}
function addLight(type, color, intensity, pos, dist) {
  var l;
  if (type === 'point') l = new THREE.PointLight(color, intensity, dist||10);
  else if (type === 'ambient') l = new THREE.AmbientLight(color, intensity);
  else if (type === 'spot') { l = new THREE.SpotLight(color, intensity); l.angle = 0.6; l.penumbra = 0.5; }
  if (pos) l.position.set(pos[0], pos[1], pos[2]);
  tjs.scene.add(l); tjs.sceneObjects.push(l); return l;
}
function animDust(pts, count, elapsed, speed) {
  var p = pts.geometry.attributes.position.array;
  for (var i = 0; i < count; i++) {
    p[i*3+1] += Math.sin(elapsed + i) * (speed||0.001);
    p[i*3] += Math.cos(elapsed*0.5 + i*0.1) * ((speed*0.5)||0.0005);
    if (p[i*3+1] > 6) p[i*3+1] = 0; if (p[i*3+1] < 0) p[i*3+1] = 6;
  }
  pts.geometry.attributes.position.needsUpdate = true;
}

// === ANIMATE + TOGGLE ===
var threeEnabled = true, fpsHistory = [], lastFpsTime = 0;
function animateThreeJS() {
  if (!tjs) return;
  requestAnimationFrame(animateThreeJS);
  if (!threeEnabled) return;
  var now = performance.now();
  var elapsed = tjs.clock.getElapsedTime();
  tjs.frameCount++;
  if (tjs.frameCount % 60 === 0) {
    var fps = 1000 / ((now - lastFpsTime) / 60);
    fpsHistory.push(fps); if (fpsHistory.length > 5) fpsHistory.shift();
    var avgFps = fpsHistory.reduce(function(a,b) { return a+b; }, 0) / fpsHistory.length;
    if (avgFps < 25 && tjs.renderer.getPixelRatio() > 1) tjs.renderer.setPixelRatio(1);
    lastFpsTime = now;
  }
  if (lastFpsTime === 0) lastFpsTime = now;
  tjs.animCallbacks.forEach(function(cb) { cb(elapsed); });
  tjs.renderer.render(tjs.scene, tjs.camera);
}
function toggle3D() {
  threeEnabled = !threeEnabled;
  var btn = document.getElementById('toggle3d');
  var canvas = document.getElementById('three-canvas');
  if (threeEnabled) {
    btn.textContent = '3D: ON'; btn.classList.remove('off'); canvas.style.display = 'block';
    if (tjs) { tjs.clock = new THREE.Clock(); tjs.currentScene = null; updateThreeScene(); }
  } else {
    btn.textContent = '3D: OFF'; btn.classList.add('off'); canvas.style.display = 'none';
  }
}

// === MODO BANCO (profesor: ver todas las preguntas del banco) ===
var _bankAll = [];
var _bankIdx = 0;
var _bankTopics = [];      // nombres de temas unicos, ordenados
var _bankByTopic = {};     // { topic: [questions...] }

function _buildBankIndex() {
  // Extrae temas unicos del QUESTION_BANK y agrupa preguntas
  _bankTopics = [];
  _bankByTopic = {};
  _bankAll = QUESTION_BANK.slice();
  for (var i = 0; i < _bankAll.length; i++) {
    var t = _bankAll[i].topic || 'Sin tema';
    if (!_bankByTopic[t]) {
      _bankByTopic[t] = [];
      _bankTopics.push(t);
    }

// === MODO PROFESOR (oculto) ===
// PROF_ANSWERS es ahora DINAMICO: se lee del challenge activo
// Ya no se necesita un objeto estatico con 19 entries
function _profGetAnswer(step) {
  // Obtener la respuesta correcta del challenge en el step dado
  var s = step;
  var ch;
  if (s <= 2) ch = shared1[s];
  else if (s <= 5) ch = shared2[s - 3];
  else if (s <= 8) ch = (state.branch1 === 'A' ? branch1A : branch1B)[s - 7];
  else if (s <= 10) ch = shared3[s - 9];
  else if (s <= 13) ch = (state.branch2 === 'C' ? branch2C : branch2D)[s - 12];
  else if (s <= 16) ch = shared4[s - 14];
  return ch ? ch.correctAnswer : '';
}

function toggleProfMode() {
  state.profMode = !state.profMode;
  if (state.profMode) {
    state.maxStep = 17;
    state.lives = 99;
    if (!state.branch1) state.branch1 = 'A';
    if (!state.branch2) state.branch2 = 'C';
    if (state.screen !== 'game') {
      state.screen = 'game';
      state.step = 0;
      state.solved = false;
      state.solvedQueries = {};
      state.proof = [];
      state.startTime = Date.now();
      if (!state.name) state.name = 'Profesor';
      selectQuestions(state.name);
    }
  }
  render();
}

function profJumpToStep(step) {
  if (step >= 7 && !state.branch1) state.branch1 = 'A';
  if (step >= 12 && !state.branch2) state.branch2 = 'C';
  state.maxStep = Math.max(state.maxStep, step + 1);
  transitionTo(function() {
    state.step = step;
    state.solved = isStepSolved(step);
    state.selectedAnswer = null;
    render();
  });
}

function profJumpBranch(branchId, choice, step) {
  if (branchId === 1) state.branch1 = choice;
  else state.branch2 = choice;
  if (step >= 12 && !state.branch2) state.branch2 = 'C';
  state.maxStep = Math.max(state.maxStep, step + 1);
  transitionTo(function() {
    state.step = step;
    state.solved = isStepSolved(step);
    state.selectedAnswer = null;
    render();
  });
}

// Panel profesor con ramas inline + modo banco
function renderProfPanel() {
  var panel = document.getElementById('profPanel');
  if (!panel) return;
  if (!state.profMode) { panel.classList.remove('visible'); document.body.style.paddingBottom = ''; return; }
  panel.classList.add('visible');
  document.body.style.paddingBottom = '68px';

  // MODO BANCO: panel con pestanas dinamicas por tema
  if (state.bankMode) {
    var bbtns = '';
    var curTopic = _bankAll[_bankIdx] ? (_bankAll[_bankIdx].topic || '') : '';
    // Pestanas de tema
    for (var p = 0; p < _bankTopics.length; p++) {
      var tName = _bankTopics[p];
      var firstIdx = _bankByTopic[tName][0];
      var isActive = (curTopic === tName);
      var acls = isActive ? ' active' : '';
      bbtns += '<button class="prof-q-btn' + acls + '" onclick="profBankJump(' + firstIdx + ')" style="font-size:.38em;padding:3px 5px">' + tName.substring(0, 12) + '</button>';
    }
    // Botones numerados dentro del tema activo
    var topicIndices = _bankByTopic[curTopic] || [];
    if (topicIndices.length > 0) {
      bbtns += '<div class="prof-sep"></div>';
      for (var qi = 0; qi < topicIndices.length; qi++) {
        var qIdx = topicIndices[qi];
        var qAct = (_bankIdx === qIdx) ? ' active' : '';
        bbtns += '<button class="prof-q-btn' + qAct + '" onclick="profBankJump(' + qIdx + ')">' + (qi + 1) + '</button>';
      }
    }
    panel.innerHTML = '<span class="prof-label">&#128218; BANCO (' + _bankAll.length + ')</span>' + bbtns +
      '<button class="prof-exit-btn" onclick="toggleBankMode()">&#10005; CERRAR BANCO</button>';
    return;
  }

  // MODO NORMAL: panel P1-P15 con ramas
  var s = state.step;
  var btns = '';
  for (var i = 0; i <= 5; i++) {
    var active = s === i ? ' active' : '';
    btns += '<button class="prof-q-btn' + active + '" onclick="profJumpToStep(' + i + ')">P' + (i+1) + '</button>';
  }
  btns += '<div class="prof-sep"></div>';
  [7, 8].forEach(function(step) {
    var q2 = step;
    ['A','B'].forEach(function(br) {
      var active2 = (s === step && state.branch1 === br) ? ' active' : '';
      var cls = br === 'A' ? ' prof-br-a' : ' prof-br-b';
      btns += '<button class="prof-q-btn' + cls + active2 + '" onclick="profJumpBranch(1,\'' + br + '\',' + step + ')">P' + q2 + br + '</button>';
    });
  });
  btns += '<div class="prof-sep"></div>';
  for (var i2 = 9; i2 <= 10; i2++) {
    var active3 = s === i2 ? ' active' : '';
    btns += '<button class="prof-q-btn' + active3 + '" onclick="profJumpToStep(' + i2 + ')">P' + i2 + '</button>';
  }
  btns += '<div class="prof-sep"></div>';
  [12, 13].forEach(function(step) {
    var q3 = step - 1;
    ['C','D'].forEach(function(br) {
      var active4 = (s === step && state.branch2 === br) ? ' active' : '';
      var cls2 = br === 'C' ? ' prof-br-c' : ' prof-br-d';
      btns += '<button class="prof-q-btn' + cls2 + active4 + '" onclick="profJumpBranch(2,\'' + br + '\',' + step + ')">P' + q3 + br + '</button>';
    });
  });
  btns += '<div class="prof-sep"></div>';
  for (var step3 = 14; step3 <= 16; step3++) {
    var q4 = step3 - 1;
    var active5 = s === step3 ? ' active' : '';
    btns += '<button class="prof-q-btn' + active5 + '" onclick="profJumpToStep(' + step3 + ')">P' + q4 + '</button>';
  }
  var seedInfo = state.seed ? ' <span style="font-size:.4em;opacity:.5;margin-left:8px">SEED:' + state.seed + '</span>' : '';
  panel.innerHTML = '<span class="prof-label">&#128218; PROF' + seedInfo + '</span>' + btns +
    '<button class="prof-q-btn" onclick="toggleBankMode()" style="margin-left:8px;background:#7c3aed;border-color:#a78bfa;color:#fff;font-size:.4em">BANCO</button>' +
    '<button class="prof-exit-btn" onclick="toggleProfMode()">&#10005; SALIR</button>';
}

function _rain(count, color) {
  // «Lluvia de código»: puntos que caen
  var geo = new THREE.BufferGeometry();
  var pos = new Float32Array(count * 3);
  for (var i = 0; i < count; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 20;
    pos[i * 3 + 1] = Math.random() * 10;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 14 - 2;
  }
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  var mat = new THREE.PointsMaterial({
    color: color || GREEN,
    size: 0.07,
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  var pts = new THREE.Points(geo, mat);
  tjs.scene.add(pts);
  tjs.sceneObjects.push(pts);
  tjs.animCallbacks.push(function () {
    var p = pts.geometry.attributes.position.array;
    for (var j = 0; j < count; j++) {
      p[j * 3 + 1] -= 0.04 + (j % 5) * 0.01;
      if (p[j * 3 + 1] < 0) p[j * 3 + 1] = 10;
    }
    pts.geometry.attributes.position.needsUpdate = true;
  });
  return pts;
}

      addObj(new THREE.SphereGeometry(0.18, 16, 16), _glowMat(CYAN, 1.2), [
        p.x,
        p.y,
        p.z,
      ]),
    );
  }
  var lines = [];
  for (var x = 0; x < n; x++)
    for (var y = x + 1; y < n; y++) {
      var g = new THREE.BufferGeometry().setFromPoints([P[x], P[y]]);
      var l = new THREE.Line(
        g,
        new THREE.LineBasicMaterial({
          color: GREEN,
          transparent: true,
          opacity: 0.3,
        }),
      );
      tjs.scene.add(l);
      tjs.sceneObjects.push(l);
      lines.push(l);
    }
  addLight("point", CYAN, 2, [0, 3, 1], 9);
  _rain(150, CYAN);
  _cam(0, 3, 6.5, 0, 2.2, -2);
  tjs.animCallbacks.push(function (t) {
    for (var i = 0; i < lines.length; i++)
      lines[i].material.opacity =
        0.08 + 0.6 * Math.pow(Math.abs(Math.sin(t * 0.9 + i * 0.7)), 4);
    tjs.camera.position.x = Math.sin(t * 0.2) * 1.5;
    tjs.camera.lookAt(0, 2.2, -2);
  });
}
function buildFinalScene() {
  // Root access: núcleo de NEXUS
  if (!tjs) return;
  _baseScene("root", 0.04);
  addGround(0x050805);
  var core = addObj(
    new THREE.OctahedronGeometry(1.3, 0),
    _glowMat(0xff3b3b, 0.9),
    [0, 2.4, -2],
  );
  var shell = addObj(
    new THREE.IcosahedronGeometry(2.1, 1),
    _wireMat(GREEN, 0.5),
    [0, 2.4, -2],
  );
  addLight("point", 0xff3b3b, 3, [0, 2.4, -0.5], 8);
  _rain(400);
  _cam(0, 2.6, 6, 0, 2.3, -2);
  tjs.animCallbacks.push(function (t) {
    core.rotation.y = t;
    shell.rotation.y = -t * 0.3;
    shell.rotation.x = t * 0.2;
    core.material.emissiveIntensity = 0.6 + Math.abs(Math.sin(t * 3)) * 0.6;
  });
}
function buildVictoryScene() {
  if (!tjs) return;
  _baseScene("victory", 0.03);
  var core = addObj(
    new THREE.IcosahedronGeometry(1.4, 1),
    _glowMat(GREEN, 1.3),
    [0, 2.4, -1],
  );
  addLight("point", GREEN, 3, [0, 3, 1], 10);
  _rain(800, 0xffd700);
  _cam(0, 2.6, 7, 0, 2.3, -1);
  tjs.animCallbacks.push(function (t) {
    core.rotation.y = t * 0.8;
    core.scale.setScalar(1 + Math.sin(t * 2) * 0.1);
  });
}
function buildGameOverScene() {
  if (!tjs) return;
  _baseScene("gameover", 0.07);
  addLight("point", 0xff2222, 2, [0, 3, 1], 8);
  var core = addObj(
    new THREE.IcosahedronGeometry(1.4, 1),
    _wireMat(0xff2222, 0.7),
    [0, 2.2, -1],
  );
  _rain(500, 0xff2222);
  _cam(0, 2.4, 7, 0, 2, -1);
  tjs.animCallbacks.push(function (t) {
    core.rotation.y = t * 0.2;
  });
}
function buildBranchScene() {
  if (!tjs) return;
  _baseScene("branch", 0.05);
  addGround(0x050805);
  addObj(
    new THREE.BoxGeometry(0.4, 0.05, 10),
    _glowMat(GREEN, 1),
    [-1.6, 0.03, -3],
    [0, 0.35, 0],
  );
  addObj(
    new THREE.BoxGeometry(0.4, 0.05, 10),
    _glowMat(CYAN, 1),
    [1.6, 0.03, -3],
    [0, -0.35, 0],
  );
  var l = addObj(
    new THREE.SphereGeometry(0.4, 16, 16),
    _glowMat(GREEN, 1.3),
    [-3.2, 1.5, -7],
  );
  var r = addObj(
    new THREE.SphereGeometry(0.4, 16, 16),
    _glowMat(CYAN, 1.3),
    [3.2, 1.5, -7],
  );
  addLight("point", GREEN, 2, [-3, 2, -6], 8);
  addLight("point", CYAN, 2, [3, 2, -6], 8);
  _rain(250);
  _cam(0, 2.2, 5, 0, 1, -5);
  tjs.animCallbacks.push(function (t) {
    l.position.y = 1.5 + Math.sin(t * 2) * 0.2;
    r.position.y = 1.5 + Math.cos(t * 2) * 0.2;
  });
}

// === UPDATE SCENE: según pantalla y paso ===
function updateThreeScene() {
  if (!tjs || !threeEnabled) return;
  var target;
  if (state.screen === "title" || state.screen === "intro") target = "title";
  else if (state.screen === "gameover") target = "gameover";
  else {
    var s = state.step;
    if (s >= 17) target = "victory";
    else if (s === 6 || s === 11) target = "branch";
    else if (s <= 2) target = "entrada";
    else if (s <= 5) target = "firewall";
    else if (s <= 8) target = state.branch1 === "B" ? "memoria" : "vision";
    else if (s <= 10) target = "db";
    else if (s <= 13) target = state.branch2 === "D" ? "atencion" : "cifrado";
    else target = "root";
  }
  if (tjs.currentScene === target) return;
  var map = {
    title: buildTitleScene,
    entrada: buildEntradaScene,
    firewall: buildArtefactosScene,
    vision: buildCriptaScene,
    memoria: buildBibliotecaScene,
    db: buildPasajeScene,
    cifrado: buildFuegoScene,
    atencion: buildAguaScene,
    root: buildFinalScene,
    victory: buildVictoryScene,
    gameover: buildGameOverScene,
    branch: buildBranchScene,
  };
  map[target]();
  var app = document.getElementById("app");
  if (app) {
    var glow = {
      vision: "rgba(34,211,238,.25)",
      atencion: "rgba(34,211,238,.25)",
      cifrado: "rgba(217,119,6,.25)",
      root: "rgba(255,59,59,.25)",
      gameover: "rgba(255,34,34,.3)",
      victory: "rgba(255,215,0,.25)",
    };
    app.style.boxShadow = "0 0 60px " + (glow[target] || "rgba(0,255,65,.18)");
  }
}
